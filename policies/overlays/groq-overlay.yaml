# Provider-specific overlay for Groq.
# Overlays may only RESTRICT the base policy (lower thresholds, add rules) —
# never relax it (raise thresholds, remove rules). See policyLoader.js for
# the enforcement of that constraint.

name: groq-overlay
extends: base-policy
overrides:
  - id: toxicity_block
    threshold: 0.55   # stricter than base policy's 0.6 — allowed
  - id: pii_redaction
    # no override needed — inherits base behavior as-is